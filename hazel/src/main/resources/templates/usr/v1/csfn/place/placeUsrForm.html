	<script>
		document.getElementById("btnSave").onclick = function(){
			let csgrArrays = [];
			
			let csgrSeq = document.querySelectorAll("[id^=csgrSeq_]");
			
			for(let i=0; i<csgrSeq.length; i++){
				let csgrArray = document.getElementById("csgrSeq_"+i).value;
				csgrArrays.push(csgrArray);
			}
			alert(csgrArrays);
			
			let hiddenInput = '';
			    hiddenInput += '<input type="hidden" id="csgrArrays" name="csgrArrays" value="'+csgrArrays+'">';
			$("#csgrSeq").append(hiddenInput);
			form.action="/v1/csfn/place/placeUsrInsert"
			form.submit();
		}
	</script>
	
	<script>
		 $('#csgrSeq').select2( {
    theme: "bootstrap-5",
    width: $( this ).data( 'width' ) ? $( this ).data( 'width' ) : $( this ).hasClass( 'w-100' ) ? '100%' : 'style',
    placeholder: $( this ).data( 'placeholder' ),
    closeOnSelect: false,
} );
